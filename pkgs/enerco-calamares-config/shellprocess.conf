---
dontChroot: false
timeout: 60
script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/system/enerco-live-setup.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/enerco-live-setup.service"
    - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "-rm -f /etc/profile.d/enerco-autostart.sh"
    - "-userdel -r enerco"
    - "-groupdel enerco"
    - "sh -c 'if [ ! -f /boot/vmlinuz-linux ]; then cp /usr/lib/modules/*/vmlinuz /boot/vmlinuz-linux 2>/dev/null || true; chmod 644 /boot/vmlinuz-linux; fi'"
