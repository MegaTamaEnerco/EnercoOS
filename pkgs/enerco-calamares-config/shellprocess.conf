---
dontChroot: false
timeout: 60
script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/system/enerco-live-setup.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/enerco-live-setup.service"
    - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "-rm -f /etc/profile.d/enerco-autostart.sh"
    - "-userdel -r enerco"
    - "-groupdel enerco"
    - "sh -c 'for kdir in /usr/lib/modules/*; do if [ -d \"$kdir\" ] && [ -f \"$kdir/vmlinuz\" ]; then if echo \"$kdir\" | grep -q zen; then cp \"$kdir/vmlinuz\" /boot/vmlinuz-linux-zen 2>/dev/null || true; chmod 644 /boot/vmlinuz-linux-zen; else cp \"$kdir/vmlinuz\" /boot/vmlinuz-linux 2>/dev/null || true; chmod 644 /boot/vmlinuz-linux; fi; fi; done; mkinitcpio -P 2>/dev/null || true'"
