---
dontChroot: false
timeout: 300
script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/system/enerco-live-setup.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/enerco-live-setup.service"
    - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "-rm -f /etc/profile.d/enerco-autostart.sh"
    - "-rm -f /etc/skel/Desktop/calamares.desktop"
    - "-rm -f /home/*/Desktop/calamares.desktop"
    - "-rm -f /usr/share/applications/calamares.desktop"
    - "-rm -f /etc/polkit-1/rules.d/49-calamares.rules"
    - "python3 -c \"import json, os; p='/etc/skel/.config/macdock/pinned.json'; os.path.exists(p) and open(p,'w').write(json.dumps([x for x in json.load(open(p)) if x!='calamares'], indent=2))\" 2>/dev/null || true"
    - "-userdel -r enerco"
    - "-groupdel enerco"
    - "python3 -c \"import glob, shutil, os; [shutil.copy2(p, '/boot/vmlinuz-linux-zen' if 'zen' in p else '/boot/vmlinuz-linux') for p in glob.glob('/usr/lib/modules/*/vmlinuz') if os.path.isfile(p)]\" 2>/dev/null || true"
    - "-sh -c 'chmod 644 /boot/vmlinuz-linux /boot/vmlinuz-linux-zen 2>/dev/null || true; mkinitcpio -P 2>/dev/null || true'"
