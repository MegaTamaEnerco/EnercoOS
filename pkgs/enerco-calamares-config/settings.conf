# Calamares settings for EnercoOS
---
modules-search:
  - /usr/lib/calamares/modules
  - local

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - shellprocess
      - initcpiocfg
      - initcpio
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - services-systemd
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: enerco
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
