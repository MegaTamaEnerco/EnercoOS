# ==============================================================================
# EnercoOS Hyprland Configuration (macOS Cupertino Theme)
# ==============================================================================

autogenerated = 0

# Monitor configuration (Prefer 1080p, fallback to preferred)
monitor=,1920x1080@60,auto,1
monitor=,preferred,auto,1

# Autostart enterprise desktop services
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swaybg -i /usr/share/backgrounds/enerco-mac.png -m fill
exec-once = /usr/local/bin/macshell-start
exec-once = /usr/local/bin/enerco-welcome
exec-once = pgrep -f VBoxClient >/dev/null || VBoxClient-all &

# Environment variables for Wayland & Qt/GTK integration
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = OZONE_PLATFORM,wayland
env = QS_ICON_THEME,MacOS-Like-Dark

# Input settings (macOS Touchpad Physics)
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        tap-and-drag = true
        drag_lock = false
        scroll_factor = 1.0
        middle_button_emulation = true
    }
    sensitivity = 0
}

# macOS 3-Finger Spaces Navigation
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Cupertino Layout & Geometry
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffffee) rgba(40c8e0ee) 45deg
    col.inactive_border = rgba(2552552508)
    layout = dwindle
    allow_tearing = false
}

# Frosted Glass & Corner Rounding
decoration {
    rounding = 14
    active_opacity = 0.98
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
        vibrancy = 0.2
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000035)
        color_inactive = rgba(00000020)
    }
}

# Smooth Apple-like Animations
animations {
    enabled = true
    bezier = appleEase, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, appleEase, popin 80%
    animation = windowsOut, 1, 4, appleEase, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, overshot, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Window Rules
windowrulev2 = float,class:^(org.kde.polkit-gnome-authentication-agent-1)$
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(calamares)$
windowrulev2 = center,class:^(calamares)$
windowrulev2 = size 840 520,class:^(calamares)$
windowrulev2 = float,title:^(EnercoOS Welcome)$
windowrulev2 = center,title:^(EnercoOS Welcome)$

# MacShell Tahoe Liquid Glass Layer Rules
layerrule = blur, macbarbg
layerrule = ignorealpha 0.05, macbarbg
layerrule = blur, macspot
layerrule = ignorealpha 0.05, macspot
layerrule = noanim, macosd
layerrule = noanim, macshot
layerrule = blur, macdock
layerrule = ignorealpha 0.2, macdock
layerrule = blur, quickshell:MacLock
layerrule = ignorezero, quickshell:MacLock

misc {
    vfr = true
    vrr = 0
    disable_hyprland_logo = true
}

# Keybindings ($mainMod is Command / Windows key)
$mainMod = SUPER

# Application Launchers & MacShell Controls
bind = $mainMod, SPACE, exec, qs -c MacShell ipc call spotlight toggle || rofi -show drun
bind = $mainMod, V, exec, qs -c MacShell ipc call spotlight clipboard
bind = $mainMod, PERIOD, exec, qs -c MacShell ipc call spotlight emoji
bind = $mainMod, Z, exec, qs -c MacShell ipc call settings toggle
bind = $mainMod, L, exec, /usr/local/bin/maclock
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, chromium --app=https://mterp.megatama-enerco.com --ozone-platform=wayland --enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder,CanvasOopRasterization,UseOzonePlatform --enable-gpu-rasterization --enable-zero-copy --ignore-gpu-blocklist
bind = $mainMod, I, exec, /usr/local/bin/enerco-installer
bind = $mainMod, F, exec, thunar

# Window Management
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglesplit
bind = $mainMod, F11, fullscreen

# Audio & Brightness Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Workspace Navigation
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse Move/Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

