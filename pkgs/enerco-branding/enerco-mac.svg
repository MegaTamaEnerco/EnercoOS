<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="deepDark" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.85" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Deep space backdrop -->
  <rect width="3840" height="2160" fill="url(#deepDark)" />

  <!-- Fluid Sonoma/Sequoia organic ribbons -->
  <path d="M -200,1600 C 600,1100 1400,2000 2400,1400 C 3200,900 3700,1300 4100,1000 L 4100,2300 L -200,2300 Z" fill="url(#wave1)" filter="url(#softGlow)" />
  <path d="M -300,900 C 800,1400 1700,700 2700,1300 C 3400,1700 3800,1100 4200,1500 L 4200,2300 L -300,2300 Z" fill="url(#wave2)" filter="url(#softGlow)" />
  <path d="M 0,1800 C 1000,1300 2000,1900 3000,1400 C 3500,1100 3800,1500 4000,1300 L 4000,2300 L 0,2300 Z" fill="url(#wave3)" opacity="0.7" />

  <!-- Subtle Enerco Watermark in Center Bottom -->
  <text x="1920" y="2060" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans', sans-serif" font-size="28" font-weight="500" fill="#ffffff" opacity="0.3" letter-spacing="8">
    ENERCO OS · ENTERPRISE WORKSTATION
  </text>
</svg>

