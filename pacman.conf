#
# /etc/pacman.conf for EnercoOS Archiso Build
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Custom In-Tree EnercoOS Package Repository (Calamares, Branding, Configs)
[enerco-local]
SigLevel = Optional TrustAll
Server = file://@ENERCO_LOCAL_REPO_PATH@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

