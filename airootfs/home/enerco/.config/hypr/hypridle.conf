# ==============================================================================
# EnercoOS Hypridle Configuration (Idle Lock & DPMS Power Management)
# ==============================================================================

general {
    lock_cmd = /usr/local/bin/maclock
    before_sleep_cmd = /usr/local/bin/maclock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim display after 4 minutes (240s) of inactivity
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 20% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# Lock screen after 10 minutes (600s) of inactivity
listener {
    timeout = 600
    on-timeout = /usr/local/bin/maclock
}

# Turn off display (DPMS) after 15 minutes (900s) of inactivity
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
