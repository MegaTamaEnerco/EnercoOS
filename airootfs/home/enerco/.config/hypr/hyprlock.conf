# ==============================================================================
# EnercoOS macOS Tahoe Frosted Glass Screen Locker
# Powered by hyprlock
# ==============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/enerco-mac.png
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.88
    brightness = 0.80
    vibrancy = 0.20
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(245, 245, 247, 0.95)
    font_size = 64
    font_family = Inter
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %e"
    color = rgba(200, 210, 225, 0.85)
    font_size = 18
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

# Corporate Logo / Circular Avatar
image {
    monitor =
    path = /usr/share/pixmaps/enerco-logo.svg
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.45)
    position = 0, 50
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = PT Mega Tama Enerco Workstation
    color = rgba(245, 245, 247, 0.9)
    font_size = 16
    font_family = Inter
    position = 0, -15
    halign = center
    valign = center
}

# macOS Frosted Glass Password Pill
input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    dots_size = 0.32
    dots_spacing = 0.22
    dots_center = true
    fade_on_empty = false
    font_family = Inter
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = 21
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(26, 32, 48, 0.70)
    font_color = rgba(245, 245, 247, 0.95)
    check_color = rgba(0, 122, 255, 0.9)
    fail_color = rgba(255, 59, 48, 0.9)
    fail_text = <i>Incorrect Password</i>
    capslock_color = rgba(255, 189, 46, 0.9)
    position = 0, -75
    halign = center
    valign = center
}
