# EnercoOS Terminal Profile (Kitty)
font_family      Cascadia Code
bold_font        auto
italic_font      auto
font_size        12.0

window_padding_width 12
background_opacity 0.88
blur 1

# Cupertino Dark Palette
background #0d1117
foreground #c9d1d9
cursor #58a6ff
selection_background #1f6feb
selection_foreground #ffffff

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Colors
color0 #161b22
color8 #484f58
color1 #ff7b72
color9 #ffa198
color2 #3fb950
color10 #56d364
color3 #d29922
color11 #e3b341
color4 #58a6ff
color12 #79c0ff
color5 #bc8cff
color13 #d2a8ff
color6 #39c5cf
color14 #56d4dd
color7 #b1bac4
color15 #f0f6fc

enable_audio_bell no
confirm_os_window_close 0

