# ==============================================================================
# EnercoOS Terminal Profile (Kitty)
# Theme: macOS Dark Glass (Apple Cupertino Palette)
# ==============================================================================

font_family      Cascadia Code
bold_font        auto
italic_font      auto
font_size        12.0

window_padding_width 16
background_opacity 0.85
blur 1

# macOS Dark Glass Palette
background #0e131f
foreground #f5f5f7
cursor #5ac8fa
cursor_shape beam
selection_background #007aff
selection_foreground #ffffff

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Standard ANSI (Apple San Francisco palette)
color0 #161b22
color8 #484f58
color1 #ff5f56
color9 #ff6b62
color2 #27c93f
color10 #32d74b
color3 #ffbd2e
color11 #ffd60a
color4 #007aff
color12 #5ac8fa
color5 #af52de
color13 #bf5af2
color6 #5ac8fa
color14 #70d7ff
color7 #e5e5ea
color15 #ffffff

enable_audio_bell no
confirm_os_window_close 0
